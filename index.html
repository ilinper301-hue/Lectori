/* Fredoka (licencia SIL Open Font License 1.1, app/fonts/OFL.txt), incluida en la app para que se vea igual sin conexión */
:root{--rd:'Fredoka',system-ui,sans-serif}
body[data-ft="l"]{--rd:'Playwrite ES','Segoe Print','Bradley Hand','Comic Sans MS',cursive}
.l,.k,.txt,.slot,.un,.pic,.ev2-it,.ev2-tx{font-family:var(--rd)}
body[data-ft="l"] :is(.l,.k,.txt,.slot,.un,.pic,.ev2-it,.ev2-tx){font-weight:400}
body[data-ft="l"] .word{display:block;text-align:center;gap:0;line-height:1.7}
body[data-ft="l"] .l{display:inline;padding:0;transform:none!important}
body[data-ft="l"] .l.on{background:var(--sun);color:#3a2a00;border-radius:12px}
body[data-ft="l"] .un{display:inline;padding:0}
body[data-ft="l"] .un.on{transform:none;background:var(--sun);color:#3a2a00}
body[data-ft="l"] :is(.txt,.ev2-tx){line-height:1.7}
.ftp{font-size:1.9rem;text-align:center;padding:8px 6px;margin:6px 0;border-radius:14px;background:var(--card)}
/* Modo Docente */
.big.md{background:linear-gradient(135deg,#7C3AED,#14B8A6);color:#fff;border-color:transparent}.big.md span{color:rgba(255,255,255,.93)}
/* Palabras de los textos: se tocan para oírlas */
.tw{border-radius:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}.tw:active{background:var(--sun);color:#3a2a00}
/* Sílabas: se iluminan letra a letra y luego la sílaba completa */
.un{display:inline-block;border-radius:12px;padding:0 6px;transition:all .15s}
.un.on{background:var(--sun);color:#3a2a00;transform:scale(1.2)}
.k.all{background:var(--accent);color:var(--on);border-color:var(--accent);transform:scale(1.06)}
.k.sy{aspect-ratio:auto;padding:16px 10px}
/* Evaluación de nivel: lo que lee el niño, con la tipografía de lectura */
.ev2-it,.ev2-tx{font-family:var(--rd)}
/* Envolturas: en vertical no cambian nada */

#app.ad .nav .chip{width:40px;height:40px;min-width:40px;border-width:1px;box-shadow:none}
#app.ad .ph{margin:2px 0 6px}
#app.ad .ph h2{font-size:1.4rem}
#app.ad .ph small{color:var(--mut);opacity:1;font-size:.82rem}
#app.ad .ph .chip.av{width:44px;height:44px;border-radius:12px;background:var(--pri);color:var(--pri-on);font-weight:600}
#app.ad .tabs{background:transparent;border-bottom:1px solid var(--line);border-radius:0;padding:0;gap:0;margin-top:8px}
#app.ad .tab{flex:1;flex-direction:row;justify-content:center;gap:6px;border-radius:0;padding:12px 2px 11px;font-size:.84rem;font-weight:500;color:var(--mut);border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:transparent!important;box-shadow:none!important;white-space:nowrap}
#app.ad .tab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
#app.ad .tab span{font-size:1rem;display:inline-flex}
#app.ad .cd,#app.ad .pg-card,#app.ad .pg-rv,#app.ad .pg-hero,#app.ad .pg-s,#app.ad .pg-t,#app.ad .stage{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(20,20,19,.04)}
#app.ad .cd{padding:16px;margin-top:12px}
#app.ad .ct{font-size:.95rem;font-weight:600;margin-bottom:8px;letter-spacing:-.005em}
#app.ad .lb{font-size:.78rem;color:var(--mut);opacity:1;margin-top:12px}
#app.ad p{color:var(--ink)}
#app.ad .btn{border-radius:10px;min-height:40px;padding:9px 14px;font-size:.88rem;font-weight:600;background:var(--pri);color:var(--pri-on);border:1px solid var(--pri);box-shadow:none}
#app.ad .btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
#app.ad .btn.dg{background:var(--card);color:var(--no);border:1px solid var(--line)}
#app.ad .btn.sm{min-height:36px;padding:7px 12px;font-size:.84rem}
#app.ad .g2 .btn,#app.ad .g3 .btn{min-height:40px;font-size:.84rem}
#app.ad .rw .btn{min-height:40px}
#app.ad select,#app.ad input,#app.ad textarea{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-height:40px;font-size:.92rem;padding:8px 10px}
#app.ad .ib{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:10px}
#app.ad .pg-hero{padding:14px}
#app.ad .pg-lv{background:var(--pri);color:var(--pri-on);border-radius:12px;width:54px;height:54px}
#app.ad .bar{height:6px;background:var(--line)}
#app.ad .pg-s svg,#app.ad .pg-t svg{color:var(--mut)}
#app.ad .pg-s{padding:10px 12px}
#app.ad .pg-s span{color:var(--mut);opacity:1}
#app.ad .pg-at,#app.ad .pg-bk{background:var(--card)!important;border:1px solid var(--line)!important;border-left:3px solid var(--warn)!important;border-radius:12px!important;box-shadow:none}
#app.ad .pg-bk .ib{background:transparent;color:var(--warn)}
#app.ad .pg-ch{border:1px solid var(--line);background:var(--bg);font-weight:600}
#app.ad .pg-ch.f{background:rgba(180,83,9,.12);border-color:rgba(180,83,9,.35)}
#app.ad .pg-nt,#app.ad .pg-lg{color:var(--mut);opacity:1}
#app.ad .fb{font-weight:500}
#app.ad .pin-k .k{border:1px solid var(--line);border-radius:14px;font-family:'Inter',system-ui,sans-serif;font-weight:500}
#app.ad .ftp{background:var(--bg);border:1px solid var(--line)}
@media (max-width:420px){#app.ad .tab span{display:none}#app.ad .tab{font-size:.82rem}}

/* ==== v3.14 ==== */
/* Menos colores en las actividades: acento (principal), neutro (secundario) y naranja solo para la letra que suena */
.btn.okb{background:var(--accent)!important;color:var(--on)!important;box-shadow:none!important}
.btn.help{background:transparent!important;color:var(--ink)!important;border:2px solid var(--line)!important}
.k.hint{border-color:var(--accent)!important;box-shadow:0 0 0 4px var(--accent)!important}
@keyframes hintp{50%{box-shadow:0 0 0 8px rgba(20,184,166,.25)}}
.okw.arm .arm{width:clamp(80px,15vh,120px);height:clamp(80px,15vh,120px);animation:pop .4s both}
/* Actividades: sin cabecera de perfil/estrellas; barra de avance del nivel */
main.mact header .hd{display:none}
.nv{gap:12px}
.pbar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden;max-width:520px}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .45s ease}
/* Transición suave entre actividades */
@keyframes actIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#app.act .stage{animation:actIn .32s ease both}
@media (prefers-reduced-motion:reduce){#app.act .stage{animation:none}.pbar i{transition:none}}
/* Primer uso */
.obd{display:flex;gap:6px;justify-content:center;margin:0 0 14px}
.obd i{width:22px;height:4px;border-radius:99px;background:var(--line)}
.obd i.on{background:var(--accent)}
.ob{text-align:left}.ob h2{text-align:left}
.obx{display:flex;align-items:center;gap:12px;margin:10px 0}
.obx .btn{flex:none;pointer-events:none;min-height:40px;padding:8px 14px;font-size:.9rem}
.obx p{margin:0;font-size:.9rem}
.obn{font-size:.85rem;color:var(--mut,#64748B);margin-top:14px}
/* Iconos de línea (menús, álbum, marcadores) */
.big i.mi{display:inline-flex;align-items:center;justify-content:center;flex:none;width:38px;height:38px;font-size:0;line-height:0;color:var(--accent)}
.big i.mi svg{display:block}
.lg i,.md1 i{display:inline-flex;align-items:center;justify-content:center;line-height:0;color:var(--accent)}
.md1:not(.on) i{color:var(--ink)}
.md1.on i{color:var(--sun)}
.lg i svg,.md1 i svg,.pic svg{display:block}
.pic svg{margin:0 auto;color:var(--accent)}
.lis{display:inline-flex;vertical-align:-4px;margin-right:4px;color:var(--accent)}
.back svg{flex:none}

/* ==== v3.15 ==== */
.mi img{display:block;width:56px;height:56px;object-fit:contain;-webkit-user-drag:none;pointer-events:none}
.mi{width:56px;height:56px;margin:-6px 0}
.big:disabled .mi{filter:grayscale(1);opacity:.6}
.tip{margin:0 0 4px;font-size:.78rem;font-weight:500;color:var(--ink);opacity:.42;text-align:center;letter-spacing:.01em}
#app.act div#fb:not(.ok):not(.no){font-weight:500;font-size:.92em;opacity:.55}
.fbc{margin-top:8px}

/* ==== v3.16 ==== */
/* Rótulo del tipo de actividad con su icono */
.atl{display:flex;align-items:center;justify-content:center;gap:8px}
.atl img{flex:none;width:40px;height:40px;margin:-8px 0}
/* La barra de acciones vacía reserva su sitio: el contenido no salta al aparecer «Siguiente» */
#app.act .stage>.row:last-child:empty{display:flex;visibility:hidden;min-height:calc(clamp(46px,7vh,64px) + clamp(10px,2vh,24px) + 10px);box-shadow:none}
/* Aire entre el dibujo y el texto que lo acompaña */
#app.act .stage>.pic{margin:clamp(4px,1.2vh,12px) 0 clamp(10px,2.4vh,22px)}
#app.act .stage>.fb+.pic{margin-top:clamp(8px,2vh,18px)}
/* «Toca una palabra para oírla» arriba; el texto, centrado en el espacio libre */
#app.act .stage>.tip:first-child{margin:4px 0 auto!important}
#app.act .stage>.tip+.txt{margin-bottom:auto}

const KW={a:['abeja','🐝'],e:['elefante','🐘'],i:['isla','🏝️'],o:['oso','🐻'],u:['uva','🍇'],h:['helado','🍦'],k:['koala','🐨'],w:['wifi','📶'],x:['xilófono','🎼'],ñ:['ñu','🐃']};

/* v3.7: criterio único de dominio (informe, panel y álbum). Al superar el nivel, su letra y sílabas quedan «superadas» (cf[k].d) y se programan para repasarse mañana;
   pasan a «dominadas» (cf[k].c) cuando se aciertan otro día. Un fallo posterior quita la confirmación. Perfiles antiguos sin cf: dominadas si su caja de repaso es ≥2 */
function cfMark(p,L){const C=p.cf=p.cf||{},S=p.s=p.s||{},t=Date.now()+864e5;(L.x?L.s:[L.u,...L.s]).forEach(k=>{if(!C[k])C[k]={d:key()};const s0=S[k]||{b:1,d:t};if(s0.d>t)s0.d=t;S[k]=s0})}
function domS(p){const C=p.cf||{},S=p.s||{},ok=[],pd=[],seen=new Set(),ks=l=>l?(l.x?l.s:[l.u,...l.s]):[];
 LV.slice(0,Math.min(p.lv,LV.length)).forEach(l=>ks(l).forEach(k=>{if(seen.has(k))return;seen.add(k);const c=C[k],b=(S[k]||{}).b||0;((c?c.c:b>=2)?ok:pd).push(k)}));
